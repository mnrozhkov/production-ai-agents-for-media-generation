name: storybook
version: 1
task: >
  Write a short illustrated holiday card for this child. The picture shows their
  wish as a single hero object. The voice reads the card aloud.

records:
  path: ../../data/kids.csv
  required: [id, name, age, wishlist]

styles:
  default: warm
  column: style
  presets:
    warm:
      visual: "storybook illustration, soft warm light, centered hero object, no text"
      negative: "people, faces, letters, logos, watermarks, signatures"
      motion: "slow camera drift, gentle twinkling light, keep the hero object centered"
      voice: "af_heart"
      music: "warm"
    playful:
      visual: "bright whimsical storybook art, vivid colors, centered hero object, no text"
      negative: "people, faces, letters, logos, watermarks, signatures"
      motion: "playful gentle bounce, sparkling snow, keep the hero object centered"
      voice: "af_bella"
      music: "playful"

stages:
  - name: plan
  - name: image
    judge: true
  - name: speech
    gate_on_image_pass: true
  - name: video
    from: image
    gate_on_image_pass: true
    sample:
      n: 10
      seed: 42

constraints:
  image:
    width: 1024
    height: 1024
    steps: 20
    guidance: 4.5
  speech:
    duration_s: 15.0
  video:
    width: 832
    height: 480
    duration_s: 5.0
    fps: 24
    frames: 121
    steps: 30
    guidance: 5.0
  record_budget_usd: 1.50
  run_budget_usd: 25.00
  pass_rate_floor: 0.70

copy_schema:
  fields:
    copy:
      type: string
      min_length: 10
      max_words: 55
    image_prompt:
      type: string
      min_length: 10
      max_words: 120
    speech_text:
      type: string
      min_length: 10
      max_words: 55
    motion_prompt:
      type: string
      min_length: 10
      max_words: 80
