[project]
name = "production-ai-agents-for-media-generation"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6.0,<7",
    "typer>=0.12,<1",
    "rich>=13.7,<15",
    "requests>=2.31,<3",
    "openai>=1.40,<3",
    "pillow>=13,<15",
    "segno>=1.6,<2",
    "boto3>=1.35,<2",
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4.4,<5", "ipykernel>=6.29,<8"]
gpu = [
    "torch==2.13.0",
    "torchvision==0.28.0",
    "diffusers==0.39.0",
    "transformers==5.13.1",
    "accelerate==1.14.0",
    "sentencepiece>=0.2,<0.3",
    "protobuf>=5,<8",
]
dev = ["pytest>=8.0,<9", "ruff>=0.4,<1"]

[project.scripts]
mediafactory = "mediafactory.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["examples/mediafactory/src/mediafactory"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples/mediafactory/tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]
